<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>检测到下载链接</title>
<!-- 剪贴板浮窗。Mac 版是 SwiftUI 画的 NSPanel（420 宽、圆角 16、半透明材质），
     这里用同一套配色复刻：卡片浮在透明窗口上，圆角由 CSS 画。
     窗口本身不抢焦点（Rust 侧 set_focusable(false)），所以按钮样式要自己保证够醒目。 -->
<script src="theme.js"></script>
<link rel="stylesheet" href="accent.css">
<style>
  :root {
    --card: #fcfbf9;
    --title: rgb(29, 29, 31);
    --sub: rgb(138, 138, 142);
    --line: rgba(0, 0, 0, 0.08);
    --ghost: rgba(0, 0, 0, 0.05);
    --ghost-press: rgba(0, 0, 0, 0.1);
    /* 次要按钮（忽略）：淡底 + 1px 描边，让它看着就是个能按的东西 */
    --btn2: rgba(0, 0, 0, 0.045);
    --btn2-line: rgba(0, 0, 0, 0.16);
    --btn2-hover: rgba(0, 0, 0, 0.085);
    --btn2-press: rgba(0, 0, 0, 0.13);
  }
  html[data-dark="1"] {
    --card: #26262a;
    --title: rgb(245, 245, 247);
    --sub: rgb(152, 152, 157);
    --line: rgba(255, 255, 255, 0.09);
    --ghost: rgba(255, 255, 255, 0.07);
    --ghost-press: rgba(255, 255, 255, 0.13);
    --btn2: rgba(255, 255, 255, 0.08);
    --btn2-line: rgba(255, 255, 255, 0.19);
    --btn2-hover: rgba(255, 255, 255, 0.13);
    --btn2-press: rgba(255, 255, 255, 0.18);
  }

  html, body {
    margin: 0;
    height: 100%;
    /* 窗口是真透明的（WebView 版浮窗）：body 不铺底色，
       圆角/描边/阴影全由 .card 自己画，浏览器抗锯齿，边缘平滑无锯齿 */
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .card {
    box-sizing: border-box;
    /* 四周留出阴影空间：窗口比卡片大一圈，透明区域什么都不画 */
    position: absolute;
    inset: 10px 12px 16px 12px;
    padding: 16px 18px 20px 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
    /* 一行式：图标｜文字｜按钮柱，三者中间对齐，谁也不悬空 */
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
  }

  /* 应用图标：主界面那张琥珀色圆角方块，用纯 CSS 画，免得为浮窗再带一个图片资源。
     高度贴着右边三行文字，上下齐平，不再是一个小方块孤零零挂在左上 */
  /* 直接吃主程序那张图标（琥珀渐变 + 白闪电箭头），
     不再手画黑色闪电——两处图标不一致，看着像两个软件 */
  .logo {
    flex: none;
    width: 50px;
    height: 50px;
    border-radius: 13px;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; display: block; }
  .logo svg { width: 31px; height: 31px; }

  .body { flex: 1; min-width: 0; }
  .head {
    font-size: 15px;
    font-weight: 600;
    color: var(--title);
    margin: 0 0 5px;
    letter-spacing: 0.1px;
  }
  /* 网址再长也不换行：末尾省略号，卡片宽度是固定的 */
  .name {
    font-size: 13.5px;
    line-height: 1.35;
    color: var(--title);
    opacity: 0.86;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta {
    margin-top: 4px;
    font-size: 12.5px;
    line-height: 1.3;
    color: var(--sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 右侧一列按钮：两个等宽、上下同宽，形成一根整齐的柱子 */
  .acts {
    flex: none;
    width: 100px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  button {
    font: inherit;
    box-sizing: border-box;
    cursor: pointer;
    border-radius: 9px;
    width: 100%;
    height: 34px;
    padding: 0 10px;
    transition: background 0.12s ease, transform 0.06s ease, border-color 0.12s ease;
  }
  button:active { transform: scale(0.985); }

  .go {
    background-color: var(--tint);
    /* 和主窗口按钮同一套渐变，观感才是一家人 */
    background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
    color: var(--on-tint);
    border: 0;
    font-size: 13.5px;
    font-weight: 600;
  }
  /* 只改 background-color：写 background 简写会把上面那层渐变清掉 */
  .go:hover { background-color: var(--tint-press); }

  /* 次要按钮也必须一眼是按钮：有底色、有描边、有文字色，不再是块光秃秃的字 */
  .no {
    background: var(--btn2);
    border: 1px solid var(--btn2-line);
    color: var(--title);
    font-size: 13px;
    font-weight: 500;
  }
  .no:hover { background: var(--btn2-hover); }
  .no:active { background: var(--btn2-press); }

  /* 关掉浮窗的倒计时：15 秒走完就收起来，和 Mac 版一致。
     左右和卡片内边距齐平，正好是上面那一行内容的宽度 */
  .bar {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 7px;
    height: 4px;
    border-radius: 2px;
    /* 轨道要能看出来：不然琥珀段像一块贴错的色块 */
    background: var(--ghost-press);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 100%;
    border-radius: 2px;
    background: var(--tint);
    transform-origin: left center;
    animation: shrink 15s linear forwards;
  }
  @keyframes shrink { to { transform: scaleX(0); } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="assets/logo.svg" alt=""></div>
    <div class="body">
      <div class="head" id="head">检测到下载链接</div>
      <div class="name" id="name"></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="acts">
      <button class="go" id="go">下载</button>
      <button class="no" id="no">忽略</button>
    </div>
    <div class="bar"><i></i></div>
  </div>

<script>
  const { invoke } = window.__TAURI__?.core ?? {};
  const { listen } = window.__TAURI__?.event ?? {};

  const $ = (id) => document.getElementById(id);
  let items = [];

  function render() {
    if (!items.length) return;
    const first = items[0];
    $("head").textContent = items.length > 1
      ? `检测到 ${items.length} 个下载链接`
      : "检测到下载链接";
    $("name").textContent = first.title || first.url;
    $("meta").textContent = first.dir
      ? `${first.kind}　存到「${first.dir}」`
      : first.kind;
    $("go").textContent = items.length > 1 ? "全部下载" : "下载";
  }

  async function pull() {
    try {
      items = await invoke("float_pending");
      render();
      restart();
    } catch (e) { /* 窗口正在关，忽略 */ }
  }

  // 15 秒没人理就自己收起来（Mac 版同样是 15 秒），进度条同步重置
  let auto = 0;
  function restart() {
    clearTimeout(auto);
    const bar = document.querySelector(".bar i");
    bar.style.animation = "none";
    void bar.offsetWidth;
    bar.style.animation = "";
    auto = setTimeout(() => invoke("float_close").catch(() => {}), 15000);
  }

  $("go").addEventListener("click", () => invoke("float_action", { action: "download" }).catch(() => {}));
  $("no").addEventListener("click", () => invoke("float_close").catch(() => {}));

  // Esc 关掉（浮窗不抢焦点，按键其实到不了这里，留着给调试和无障碍用）
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") invoke("float_close").catch(() => {});
  });

  // 复用窗口时 Rust 会 emit 一次，让页面重新拉内容
  listen?.("float-data", pull);
  pull();
</script>
</body>
</html>
