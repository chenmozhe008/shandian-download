<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>下载完成</title>
<!-- 下载完成卡片：和剪贴板浮窗同一套外观，在屏幕右下角、任务栏上方，不抢焦点，8 秒自己消失。
     圆角和阴影由 CSS 画，窗口本身透明（见 float.rs） -->
<script src="theme.js"></script>
<style>
  :root {
    --card: #fcfbf9; --title: rgb(29, 29, 31); --sub: rgb(138, 138, 142);
    --tint: rgb(232, 154, 0); --tint-press: rgb(210, 138, 0); --on-tint: #fff;
    --line: rgba(0, 0, 0, 0.08); --btn2: rgba(0, 0, 0, 0.045); --btn2-line: rgba(0, 0, 0, 0.16); --btn2-hover: rgba(0, 0, 0, 0.085);
    --ok: rgb(52, 168, 83);
  }
  html[data-dark="1"] {
    --card: #26262a; --title: rgb(245, 245, 247); --sub: rgb(152, 152, 157);
    --tint: rgb(255, 181, 38); --tint-press: rgb(235, 165, 30); --on-tint: #1d1d1f;
    --line: rgba(255, 255, 255, 0.1); --btn2: rgba(255, 255, 255, 0.07); --btn2-line: rgba(255, 255, 255, 0.18); --btn2-hover: rgba(255, 255, 255, 0.12);
    --ok: rgb(90, 200, 120);
  }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default;
    font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  .card {
    box-sizing: border-box; position: absolute; inset: 10px 12px 16px 12px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
  }
  .icon { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; }
  .text { flex: 1; min-width: 0; }
  .title { font-size: 13px; font-weight: 600; color: var(--title); }
  .name { margin-top: 3px; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { flex: none; display: flex; gap: 6px; }
  button { font: inherit; font-size: 12px; height: 28px; padding: 0 10px; border-radius: 7px; cursor: pointer; color: var(--title); background: var(--btn2); border: 1px solid var(--btn2-line); }
  button:hover { background: var(--btn2-hover); }
  #open, #folder { display: inline-flex; align-items: center; gap: 5px; }
  #folder[hidden] { display: none; }
  #folder { background: var(--tint); border-color: transparent; color: var(--on-tint); }
  #folder:hover { background: var(--tint-press); }
  #open.relogin { background: var(--tint); border-color: transparent; color: var(--on-tint); }
  #close { width: 28px; padding: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5l3.4 3.4L14 6"/></svg></div>
    <div class="text">
      <div class="title" id="title">下载完成</div>
      <div class="name" id="name"></div>
    </div>
    <div class="btns">
      <button id="folder"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>打开文件夹</span></button>
      <button id="open"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span>打开文件</span></button>
      <button id="close" aria-label="关闭">✕</button>
    </div>
  </div>
<script>
  const { invoke } = window.__TAURI__?.core ?? {};
  const { listen } = window.__TAURI__?.event ?? {};
  const $ = (id) => document.getElementById(id);
  let timer;
  let noAuto = false;
  let updateVersion = null;
  const close = () => invoke("done_close").catch(() => {});
  // 鼠标停在卡片上时别消失，移开再算 8 秒
  const arm = () => { clearTimeout(timer); if (noAuto) return; timer = setTimeout(close, 8000); };
  async function pull() {
    const d = await invoke("done_pending").catch(() => null);
    if (!d) return;
    updateVersion = String(d.id).startsWith("__windows_update__:") ? d.id.split(":")[1] : null;
    $("open").disabled = false;
    if (updateVersion) {
      clearTimeout(timer);
      noAuto = true;
      $("title").textContent = "发现新版本";
      $("name").textContent = d.title;
      $("name").title = d.title;
      $("open").hidden = false;
      $("open").querySelector("span").textContent = "立即更新";
      $("open").classList.add("relogin");
      $("folder").hidden = true;
      return;
    }
    if (String(d.id).startsWith("__cloud_account__:")) {
      $("title").textContent = d.heading;
      $("name").textContent = d.title;
      $("name").title = d.title;
      $("open").hidden = false;
      $("open").querySelector("span").textContent = "重新关联";
      $("open").classList.add("relogin");
      $("folder").hidden = true;
      clearTimeout(timer);
      noAuto = true;
      return;
    }
    noAuto = false;
    $("open").querySelector("span").textContent = "打开文件";
    $("open").classList.remove("relogin");
    $("open").hidden = false;
    $("folder").hidden = false;
    $("title").textContent = d.more > 0 ? `下载完成（另有 ${d.more} 项）` : "下载完成";
    if (d.heading) {
      // 润色等耗时操作做完：本机视频可以直接播放，NAS 上的只提醒
      $("title").textContent = d.heading;
      $("folder").hidden = true;
      $("open").hidden = String(d.id).startsWith("nas:");
      $("open").querySelector("span").textContent = "播放";
    }
    $("name").textContent = d.title;
    $("name").title = d.title;
    arm();
  }
  $("open").addEventListener("click", async () => {
    if (!updateVersion) { await invoke("done_action", { action: "open" }).catch(() => {}); return; }
    $("open").disabled = true;
    $("name").textContent = "正在下载安装包…";
    try { await invoke("update_install", { version: updateVersion }); }
    catch (error) { showUpdateRetry(String(error)); }
  });
  function showUpdateRetry(text) {
    $("name").textContent = text;
    $("name").title = text;
    $("open").disabled = false;
    $("open").querySelector("span").textContent = "重试更新";
  }
  listen?.("update-progress", ({ payload }) => {
    if (!updateVersion || payload?.version !== updateVersion) return;
    if (payload.phase === "retry" || payload.phase === "failed") {
      showUpdateRetry(payload.message || "安装已关闭，可重试更新");
      return;
    }
    $("open").disabled = true;
    $("name").textContent = payload.phase === "installing" ? "正在安装更新…" :
      payload.phase === "verifying" ? "正在校验安装包…" : "正在下载 " + Math.round(payload.percent || 0) + "%";
  });
  $("folder").addEventListener("click", () => { invoke("done_action", { action: "folder" }).catch(() => {}); });
  $("close").addEventListener("click", close);
  document.body.addEventListener("mouseenter", () => clearTimeout(timer));
  document.body.addEventListener("mouseleave", arm);
  listen?.("done-data", pull);
  pull();
</script>
</body>
</html>
