name: macOS 版 Bug 反馈 / Bug Report
description: 反馈 macOS 版闪电全能下载的使用问题或异常
labels: ["bug", "macos"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！如果你使用的是 **Windows 版**，请返回上一页选择「Windows 版问题反馈」。
  - type: input
    id: version
    attributes:
      label: 应用版本 / App Version
      placeholder: 例如：0.22.6
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与芯片 / macOS & Chip
      placeholder: 例如：macOS 15.3 / Apple M2 或 Intel
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Steps
      placeholder: 请描述具体现象、涉及的链接类型（磁力 / 直链 / 视频站 / 飞书等）以及如何复现。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息或截图（可选）/ Diagnostics or Screenshots
      description: 可在应用内使用「导出诊断信息」（不含路径、片名、链接和令牌）后粘贴，或直接拖入截图。
